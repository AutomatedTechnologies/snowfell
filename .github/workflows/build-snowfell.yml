name: Snowfell test build

on:
  push:
    branches: [build-test]
  workflow_dispatch:

# The publish step creates a GitHub Release with GITHUB_TOKEN (Distro-line
# precedent, 2026-11-07: default token needs contents: write declared).
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app icon (iconutil, from the committed iconset)
        run: |
          iconutil -c icns Snowfell/Resources/AppIcon.iconset -o Snowfell/Resources/Snowfell.icns
          ls -la Snowfell/Resources/Snowfell.icns

      - name: Build app (make app — clang, unsigned, x86_64, 10.13 floor)
        run: |
          set -o pipefail
          make app 2>&1 | tee clang.log
          cp Snowfell/Resources/Snowfell.icns Snowfell.app/Contents/Resources/
          ls -la Snowfell.app/Contents/Resources/

      - name: Build storage service (SF-T12) and place helper in bundle
        run: |
          # Portable C99 + sqlite3; built for the same x86_64 / 10.13
          # floor as the app and placed beside the app executable, where
          # the V12 Storage lens's pathForAuxiliaryExecutable: looks.
          # gnu99 + _DARWIN_C_SOURCE: the sources use BSD/Darwin surface
          # (arc4random_buf, strcasestr, INADDR_LOOPBACK) that the macOS
          # SDK headers hide under strict C99 visibility — the SF-T12
          # sources are unchanged; only the build's feature exposure is
          # set (first CI attempt of this build failed on exactly this).
          make -C StorageService clean
          make -C StorageService CC="clang -target x86_64-apple-macos10.13" CFLAGS="-std=gnu99 -D_DARWIN_C_SOURCE -O2 -Wall -Wextra" service 2>&1 | tee service-build.log
          test -x StorageService/snowfell-storage-service
          file StorageService/snowfell-storage-service
          cp StorageService/snowfell-storage-service "Snowfell.app/Contents/MacOS/SnowfellStorageService"
          chmod +x "Snowfell.app/Contents/MacOS/SnowfellStorageService"
          ls -la Snowfell.app/Contents/MacOS/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-log
          path: |
            clang.log
            service-build.log

      # Build identity is FIXED at snowfell-test-2 for this build line:
      # github.run_number counts CI attempts, not builds (attempt 2 of
      # this build failed at the storage-service step on strict-C99
      # header visibility; the build it was producing is still test-2).
      # The attempt number stays visible in the release notes stamp.
      - name: Stamp build version and package app as zip
        if: success()
        run: |
          APP="Snowfell.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion snowfell-test-2" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/Snowfell"
          ditto -c -k --keepParent "$APP" Snowfell-test.zip
          ls -la Snowfell-test.zip

      - name: Upload test build zip (survival copy)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: snowfell-test-zip
          path: Snowfell-test.zip

      - name: Publish prerelease with test build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')
          NOTES="Internal test build of Snowfell, the Detroit Automation Academy's Jira-style board app over GitHub Projects for macOS High Sierra: every Academy project board in one native window — portfolio, per-board kanban in each board's own status vocabulary, item detail, orchestration queue (enqueue-only in this build), roadmap, command palette, incidents lens — reading a pinned, hash-verified registry snapshot, fully offline. Write-back is compiled OFF in this build. Publisher: Detroit Automation Academy. Unsigned test build — not gate-cleared, not yet verified on the High Sierra rig; install from the Distro catalog (testing).

          NEW IN snowfell-test-2: (1) interface uplifted to the decision-gate HTML baseline — kanban columns as tinted wells with letterspaced uppercase headers, cards with full wrapping titles and label pills, portfolio as a view-based table with health dots and an Open / Done split per board; (2) the SF-T12 storage domain ships: the SnowfellStorageService helper is bundled in Contents/MacOS and the V12 Storage lens (View menu, Cmd-8) is live — multi-tenant storage/CMS over a loopback-only REST client, content-addressed dedup by SHA-256; (3) bundled registry snapshot advanced to v8-0041 (schema 8); (4) board-state derivation presentation — Portfolio State and the Board header read the registry's derived state (a board whose items all sit in its own terminal status presents as Complete, raw GitHub state kept as secondary detail) whenever the loaded snapshot carries sf_board_state (schema v9+; a later snapshot can be pulled in-app via Sync, Check Now, Apply Update).

          BUILD STAMP — Built: $BUILT · Build: snowfell-test-2 (CI run ${{ github.run_id }}, attempt ${{ github.run_number }}) · Agent: Minion · Authorized: J. Spencer Smith, directive of 2026-11-12 (Snowfell UI uplift + SF-T12 repack after the first Air rig run)"
          gh release create snowfell-test-2 Snowfell-test.zip \
            --prerelease \
            --title "Snowfell test build 2" \
            --notes "$NOTES"
