name: Snowfell test build

on:
  push:
    branches: [build-test]
  workflow_dispatch:

# The publish step creates a GitHub Release with GITHUB_TOKEN (Distro-line
# precedent, 2026-11-07: default token needs contents: write declared).
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app icon (iconutil, from the committed iconset)
        run: |
          iconutil -c icns Snowfell/Resources/AppIcon.iconset -o Snowfell/Resources/Snowfell.icns
          ls -la Snowfell/Resources/Snowfell.icns

      - name: Build app (make app — clang, unsigned, x86_64, 10.13 floor)
        run: |
          set -o pipefail
          make app 2>&1 | tee clang.log
          cp Snowfell/Resources/Snowfell.icns Snowfell.app/Contents/Resources/
          ls -la Snowfell.app/Contents/Resources/

      - name: Build storage service (SF-T12) and place helper in bundle
        run: |
          # Portable C99 + sqlite3; built for the same x86_64 / 10.13
          # floor as the app and placed beside the app executable, where
          # the V12 Storage lens's pathForAuxiliaryExecutable: looks.
          # gnu99 + _DARWIN_C_SOURCE: the sources use BSD/Darwin surface
          # (arc4random_buf, strcasestr, INADDR_LOOPBACK) that the macOS
          # SDK headers hide under strict C99 visibility — the SF-T12
          # sources are unchanged; only the build's feature exposure is
          # set (first CI attempt of this build failed on exactly this).
          make -C StorageService clean
          make -C StorageService CC="clang -target x86_64-apple-macos10.13" CFLAGS="-std=gnu99 -D_DARWIN_C_SOURCE -O2 -Wall -Wextra" service 2>&1 | tee service-build.log
          test -x StorageService/snowfell-storage-service
          file StorageService/snowfell-storage-service
          cp StorageService/snowfell-storage-service "Snowfell.app/Contents/MacOS/SnowfellStorageService"
          chmod +x "Snowfell.app/Contents/MacOS/SnowfellStorageService"
          ls -la Snowfell.app/Contents/MacOS/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-log
          path: |
            clang.log
            service-build.log

      # Build identity is FIXED at snowfell-test-5 for this build line:
      # github.run_number counts CI attempts, not builds. The attempt
      # number stays visible in the release notes stamp. (test-2 note:
      # its attempt 2 failed at the storage-service step on strict-C99
      # header visibility — the gnu99 fix below is that build's.)
      - name: Stamp build version and package app as zip
        if: success()
        run: |
          APP="Snowfell.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion snowfell-test-5" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/Snowfell"
          ditto -c -k --keepParent "$APP" Snowfell-test.zip
          ls -la Snowfell-test.zip

      - name: Upload test build zip (survival copy)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: snowfell-test-zip
          path: Snowfell-test.zip

      - name: Publish prerelease with test build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')
          NOTES="Internal test build of Snowfell, the Detroit Automation Academy's Jira-style board app over GitHub Projects for macOS High Sierra: every Academy project board in one native window — a navigation bar on every window, portfolio with each board's own GitHub updated date, per-board kanban in each board's own status vocabulary, item detail, orchestration queue (staging-only in this build), roadmap, command palette, incidents lens, updates lens — reading a pinned, hash-verified registry snapshot, fully offline. Write-back is compiled OFF in this build. Publisher: Detroit Automation Academy. Unsigned test build — not gate-cleared, not yet verified on the High Sierra rig; install from the Distro catalog (testing).

          NEW IN snowfell-test-5 (Snowfell development coordinator build under the owner's delegation directive of 2026-11-13, 22:40 EST): (1) the Portfolio gains its Updated column — every board row now shows GitHub's own updated date for that project, read from the new sf_boards.gh_updated_at column carried by registry snapshot v10-0058 (schema 10); the column removes itself when a snapshot carries no per-board stamps, so older snapshots render exactly as before; (2) snapshot freshness is glanceable: the navigation bar's Updates segment gains a filled-dot marker whenever the served snapshot differs from the running one or an update is staged, and the Portfolio header names the staged or served update in words beside the running snapshot; (3) M-09 hardening of SnowfellStorageService: the service still binds 127.0.0.1 by default, and now refuses any non-loopback bind unless SNOWFELL_CLOUD_ALLOW_REMOTE=1 is also set — widening the listen surface takes two deliberate acts; the bound address is printed in the startup log either way, and a new bind-clamp test driver covers the refusal; (4) the bundled registry snapshot advances from v9-0049 to v10-0058 (83 boards, 763 items, 5 incidents), size- and SHA-256-verified against the canonical registry at packaging. Everything test-4 shipped carries over: the navigation bar on every window, the Updates lens, the decluttered staging language, the SF-T12 storage domain, and the board-state derivation presentation. Safety properties are unchanged: write-back remains compiled OFF, and nothing sends without the owner's explicit Send Pending Changes in an armed build.

          BUILD STAMP — Built: $BUILT · Build: snowfell-test-5 (CI run ${{ github.run_id }}, attempt ${{ github.run_number }}) · Agent: Minion · Authorized: J. Spencer Smith, directive of 2026-11-13 (Snowfell backlog continuation, coordinator full delegation 22:40 EST)"
          gh release create snowfell-test-5 Snowfell-test.zip \
            --prerelease \
            --title "Snowfell test build 5" \
            --notes "$NOTES"
