name: Snowfell test build

on:
  push:
    branches: [build-test]
  workflow_dispatch:

# The publish step creates a GitHub Release with GITHUB_TOKEN (Distro-line
# precedent, 2026-11-07: default token needs contents: write declared).
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app icon (iconutil, from the committed iconset)
        run: |
          iconutil -c icns Snowfell/Resources/AppIcon.iconset -o Snowfell/Resources/Snowfell.icns
          ls -la Snowfell/Resources/Snowfell.icns

      - name: Build app (make app — clang, unsigned, x86_64, 10.13 floor)
        run: |
          set -o pipefail
          make app 2>&1 | tee clang.log
          cp Snowfell/Resources/Snowfell.icns Snowfell.app/Contents/Resources/
          ls -la Snowfell.app/Contents/Resources/

      - name: Build storage service (SF-T12) and place helper in bundle
        run: |
          # Portable C99 + sqlite3; built for the same x86_64 / 10.13
          # floor as the app and placed beside the app executable, where
          # the V12 Storage lens's pathForAuxiliaryExecutable: looks.
          # gnu99 + _DARWIN_C_SOURCE: the sources use BSD/Darwin surface
          # (arc4random_buf, strcasestr, INADDR_LOOPBACK) that the macOS
          # SDK headers hide under strict C99 visibility — the SF-T12
          # sources are unchanged; only the build's feature exposure is
          # set (first CI attempt of this build failed on exactly this).
          make -C StorageService clean
          make -C StorageService CC="clang -target x86_64-apple-macos10.13" CFLAGS="-std=gnu99 -D_DARWIN_C_SOURCE -O2 -Wall -Wextra" service 2>&1 | tee service-build.log
          test -x StorageService/snowfell-storage-service
          file StorageService/snowfell-storage-service
          cp StorageService/snowfell-storage-service "Snowfell.app/Contents/MacOS/SnowfellStorageService"
          chmod +x "Snowfell.app/Contents/MacOS/SnowfellStorageService"
          ls -la Snowfell.app/Contents/MacOS/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-log
          path: |
            clang.log
            service-build.log

      # Build identity is FIXED at snowfell-test-6 for this build line:
      # github.run_number counts CI attempts, not builds. The attempt
      # number stays visible in the release notes stamp. (test-2 note:
      # its attempt 2 failed at the storage-service step on strict-C99
      # header visibility — the gnu99 fix below is that build's.)
      - name: Stamp build version and package app as zip
        if: success()
        run: |
          APP="Snowfell.app"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion snowfell-test-6" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          file "$APP/Contents/MacOS/Snowfell"
          ditto -c -k --keepParent "$APP" Snowfell-test.zip
          ls -la Snowfell-test.zip

      - name: Upload test build zip (survival copy)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: snowfell-test-zip
          path: Snowfell-test.zip

      - name: Publish prerelease with test build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')
          NOTES="Internal test build of Snowfell, the Detroit Automation Academy's Jira-style board app over GitHub Projects for macOS High Sierra: every Academy project board in ONE native window — a navigation bar whose eight segments switch the lens in place (portfolio, per-board kanban in each board's own status vocabulary, staged changes, orchestration, roadmap, incidents, storage, updates), item detail, command palette, reading a pinned, hash-verified registry snapshot, fully offline. Write-back is compiled OFF in this build. Publisher: Detroit Automation Academy. Unsigned test build — not gate-cleared, not yet verified on the High Sierra rig; install from the Distro catalog (testing).

          NEW IN snowfell-test-6 (Snowfell development coordinator build under the owner's delegation directive of 2026-11-13, 22:40 EST): (1) SINGLE-WINDOW NAVIGATION — the owner's verdict on test-5 was that the bar was “haphazard and inconsistent: some buttons open new windows, others open in same.” There is now exactly one window; all eight segments switch its content in place, the filled segment always names the visible lens, the frame never moves, and no segment press creates or orders another window. Item Detail, Preferences, and the Command Palette are auxiliary surfaces and carry no segment bar. All View-menu and Cmd-key entries land on the same in-place lenses. (2) THE STAGED CRASH IS FIXED — test-5 crashed (EXC_BAD_ACCESS in objc_retain from showWriteBackQueue:) when Staged was pressed after the Staged window had been closed: the satellite window's lifetime was tied to its closed state (default releasedWhenClosed) while AppDelegate held it in a strong property that was never nilled, so the press retained a freed object (proven by symbolication of the shipped test-5 binary: +630 is the queueWindow getter's result at the makeKeyAndOrderFront line). The satellite window no longer exists; the Staged lens is a content controller in the one window, and every remaining auxiliary window is created releasedWhenClosed = NO. (3) The navigation toolbar's delegate now builds its single item once and returns the same instance (a view may live in only one toolbar item). Everything test-5 shipped carries over: the Portfolio Updated column on the bundled snapshot v10-0058, glanceable freshness, the M-09 storage-service bind clamp, decluttered staging language, SF-T12 storage, board-state derivation. Safety properties are unchanged: write-back remains compiled OFF.

          BUILD STAMP — Built: $BUILT · Build: snowfell-test-6 (CI run ${{ github.run_id }}, attempt ${{ github.run_number }}) · Agent: Minion · Authorized: J. Spencer Smith, directive of 2026-11-13 (Snowfell backlog continuation, coordinator full delegation 22:40 EST); navigation verdict + crash report of 2026-11-14"
          gh release create snowfell-test-6 Snowfell-test.zip \
            --prerelease \
            --title "Snowfell test build 6" \
            --notes "$NOTES"
